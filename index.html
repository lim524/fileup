<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="여러 파일을 수정 시간순으로 정렬하고 번호를 붙여 다운로드하세요.">
  <title>파일순서 · 시간순 파일 정리</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
<header class="top"><div class="wrap brand"><span class="mark" aria-hidden="true">≡</span> 파일순서</div></header>
<main class="wrap">
  <div class="intro">
    <h1>시간순 파일 정리</h1>
    <p>여러 파일에 수정 시간순으로 번호를 붙이고 ZIP으로 받으세요.</p>
  </div>
  <div class="workspace">
    <section class="panel controls" aria-label="파일 및 정렬 설정">
      <h2>파일 추가</h2>
      <div id="drop" class="drop">
        <span aria-hidden="true" class="upload-icon">+</span>
        <strong>파일을 여기에 끌어놓으세요</strong>
        <button id="pick" type="button" class="primary">파일 선택</button>
        <input id="files" type="file" multiple hidden>
      </div>
      <label for="sort">정렬 방향</label>
      <select id="sort">
        <option value="asc">오래된 파일 먼저</option>
        <option value="desc">최신 파일 먼저</option>
      </select>
      <label class="check"><input id="keep" type="checkbox"> 번호 뒤에 원래 이름 유지</label>
      <p class="privacy">파일은 브라우저에서만 처리됩니다.</p>
    </section>
    <section class="panel preview" aria-labelledby="preview-title">
      <div class="panel-head"><div><h2 id="preview-title">정리 결과</h2><p id="count" class="sub" aria-live="polite">파일 0개</p></div><button id="clear" type="button" class="quiet" disabled>목록 비우기</button></div>
      <div id="empty" class="empty">
        <span class="sample" aria-hidden="true"><b>1</b><b>2</b><b>3</b></span>
        <p>파일을 추가하면 새 이름을 확인할 수 있어요.</p>
      </div>
      <div id="table" class="table-wrap" hidden>
        <table><thead><tr><th scope="col">원래 이름</th><th scope="col">수정 시간</th><th scope="col">새 이름</th><th scope="col"><span class="sr-only">제거</span></th></tr></thead><tbody id="rows"></tbody></table>
      </div>
      <div class="download"><p id="status" role="status"></p><button id="download" type="button" class="primary" disabled>ZIP 다운로드</button></div>
    </section>
  </div>
</main>
</body>
</html>
